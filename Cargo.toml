[package]
name = "uoe-ms-auth"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/platinumxy/uoe-ms-auth"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
rpassword = "7.5.4"
serde_json = "1.0.151"
tempfile = "3.27.0"
thirtyfour = "0.37.5"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "time"] }
pyo3 = { version = "0.24.2", features = ["extension-module", "abi3-py39"] }

[features]
default = ["logging"] 
dbg = []
show-browser = []
logging = []
